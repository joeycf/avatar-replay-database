<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig for the image generators (scripts/og.ts, scripts/art.ts).

  The @fontsource packages ship only .woff/.woff2, which fontconfig does not
  read, so the display and UI faces are invisible to sharp/librsvg unless they
  are provided as real font files. `fc-match Cinzel` on a clean machine answers
  with DejaVuSans — a plausible fallback, silently, which is checklist 5d's
  whole point.

  The four OFL TTFs beside this file are committed for exactly that reason,
  fetched 2026-09-18 and verified in-session against their own cmap tables
  (no fvar, so they are static faces librsvg can use):

    Cinzel-Bold.ttf, Cinzel-Black.ttf   github.com/NDISCOVER/Cinzel, fonts/ttf
    Figtree-Regular.ttf, -Bold.ttf      github.com/erikdkennedy/figtree, fonts/ttf

  google/fonts ships Cinzel ONLY as a variable Cinzel[wght].ttf, which is why
  the static repo is the source here.

  5d NEEDS TWO PROBE STRINGS, and on this game the latin one must include
  LOWERCASE:

    latin      "AVATAR/REPLAY Toph Kyoshi Ozai Avatar Aang 0123456789 3-2 ·"
    latin-ext  a codepoint >= U+0100 — "ō" (U+014D)

  Cinzel's lowercase is SMALL CAPS (measured: k/K advance 601/700, a/A 0.871),
  not absent — so a probe of capitals only would draw identically in Cinzel and
  in a fallback serif and prove nothing about the face that actually loaded.
  Verified in-session on all four TTFs: every one carries a, A, ō, ', the
  digits, · (U+00B7) and – (U+2013).

  The roster is the easiest on the platform for this check — no fighter name
  here carries punctuation at all, unlike Strive's JACK-O' / ZATO=1 / ASUKA R#.
  The characters that DO need proving are the card's own furniture: the score
  en-dash and the middot separators.
-->
<fontconfig>
  <dir prefix="default">.</dir>
  <cachedir prefix="default">.fc-cache</cachedir>
</fontconfig>
